<!DOCTYPE html>
<html lang="ky">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Математика — Сүрөттөр</title>

<style>
body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#fffdfb;
  color:#172d4d;
  padding:25px 15px;
}

h1{
  text-align:center;
  margin-bottom:30px;
}

#pictures{
  max-width:1100px;
  margin:auto;
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(200px,1fr));
  gap:18px;
}

.card{
  background:white;
  padding:12px;
  border-radius:15px;
  box-shadow:0 3px 15px rgba(0,0,0,.08);
  text-align:center;
}

.card img{
  width:100%;
  height:220px;
  object-fit:contain;
  border-radius:10px;
}

.card a{
  display:block;
  margin-top:10px;
  text-decoration:none;
  color:#172d4d;
  font-weight:bold;
  word-break:break-word;
}

.loading{
  text-align:center;
  font-size:18px;
}

.back{
  display:block;
  text-align:center;
  margin:30px 0;
  color:#e87991;
  font-weight:bold;
  text-decoration:none;
}
</style>
</head>

<body>

<h1>🖼️ Математика — Сүрөттөр</h1>

<div id="pictures">
  <div class="loading">⏳ Сүрөттөр жүктөлүүдө...</div>
</div>

<a class="back" href="../">
  ← Математикага кайтуу
</a>

<script>

const owner = "taalajkulidirisova-teacher";
const repo = "talaykulidirisova--teacher";

const folder = "Математика/Сүрөттөр";

const api =
`https://api.github.com/repos/${owner}/${repo}/contents/${encodeURIComponent(folder)}`;

fetch(api)

.then(response => response.json())

.then(files => {

  const box = document.getElementById("pictures");

  box.innerHTML = "";

  if (!Array.isArray(files)) {
    box.innerHTML =
    "<p class='loading'>Азырынча сүрөт жок.</p>";
    return;
  }

  files
  .filter(file =>
    /\.(jpg|jpeg|png|webp|gif)$/i.test(file.name)
  )
  .forEach(file => {

    const card = document.createElement("div");

    card.className = "card";

    card.innerHTML = `

      <a href="${file.download_url}" target="_blank">

        <img
          src="${file.download_url}"
          alt="${file.name}"
        >

      </a>

      <a href="${file.download_url}" target="_blank">
        🖼️ ${file.name}
      </a>

    `;

    box.appendChild(card);

  });

})

.catch(error => {

  document.getElementById("pictures").innerHTML =
  "<p class='loading'>❌ Сүрөттөрдү жүктөөдө ката кетти.</p>";

});

</script>

</body>
</html>
