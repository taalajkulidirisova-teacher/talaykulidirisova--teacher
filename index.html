<!DOCTYPE html>
<html lang="ky">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Идирисова Талайкүл — Мугалим</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html{
    scroll-behavior:smooth;
}

body{
    font-family:Georgia,"Times New Roman",serif;
    background:#fffdfb;
    color:#14284b;
}

a{
    text-decoration:none;
    color:inherit;
}

.container{
    width:min(1180px,92%);
    margin:auto;
}

/* ===== HEADER ===== */

header{
    height:72px;
    background:#fff;
    display:flex;
    align-items:center;
    position:sticky;
    top:0;
    z-index:1000;
    box-shadow:0 2px 18px rgba(0,0,0,.07);
}

.header-inner{
    width:min(1200px,94%);
    margin:auto;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:20px;
}

.logo{
    display:flex;
    align-items:center;
    gap:8px;
    font-size:21px;
    font-weight:bold;
    color:#102b52;
}

.logo span{
    color:#ed7892;
}

.logo-icon{
    font-size:32px;
}

nav{
    display:flex;
    align-items:center;
    gap:25px;
}

nav a{
    font-family:Arial,sans-serif;
    font-size:13px;
    font-weight:bold;
    transition:.3s;
}

nav a:hover,
nav a.active{
    color:#ed7892;
}

.contact-btn{
    background:#ed7892;
    color:white;
    padding:13px 24px;
    border-radius:30px;
    font-family:Arial,sans-serif;
    font-size:13px;
    font-weight:bold;
}

.menu-btn{
    display:none;
    font-size:28px;
}

/* ===== HERO ===== */

.hero{
    min-height:480px;
    padding:35px 0 0;
    background:
        radial-gradient(circle at 5% 20%,#e8f5fa 0,transparent 17%),
        radial-gradient(circle at 90% 20%,#fff0f3 0,transparent 18%),
        linear-gradient(135deg,#fffdf9,#fff8f5);
    overflow:hidden;
}

.hero-inner{
    width:min(1180px,92%);
    margin:auto;
    display:grid;
    grid-template-columns:1fr 1fr;
    align-items:center;
}

.hero-text{
    padding-left:45px;
}

.script{
    color:#ed7892;
    font-size:21px;
    font-style:italic;
    margin-bottom:10px;
}

.hero h1{
    color:#102b52;
    font-size:43px;
    line-height:1.02;
    margin-bottom:14px;
}

.school-name{
    color:#31506f;
    font-size:15px;
    font-weight:bold;
    line-height:1.4;
    margin-bottom:7px;
}

.subtitle{
    display:flex;
    align-items:center;
    gap:10px;
    font-size:16px;
    font-weight:bold;
    margin-bottom:22px;
}

.subtitle:before,
.subtitle:after{
    content:"";
    width:35px;
    height:1px;
    background:#cba45c;
}

.quote{
    position:relative;
    padding-left:35px;
    max-width:490px;
    color:#394960;
    font-size:14px;
    line-height:1.6;
    margin-bottom:23px;
}

.quote:before{
    content:"“";
    position:absolute;
    left:0;
    top:-13px;
    color:#f3c5cf;
    font-size:55px;
}

.buttons{
    display:flex;
    gap:13px;
    flex-wrap:wrap;
}

.btn{
    padding:13px 23px;
    border-radius:30px;
    font-family:Arial,sans-serif;
    font-size:13px;
    font-weight:bold;
}

.btn-blue{
    background:#102b52;
    color:#fff;
}

.btn-pink{
    background:#ed7892;
    color:#fff;
}

.hero-photo{
    height:430px;
    display:flex;
    justify-content:center;
    align-items:flex-end;
    position:relative;
}

.photo-circle{
    width:395px;
    height:395px;
    border-radius:50%;
    background:#f8dce0;
    border:3px solid #d9bb79;
    outline:1px
