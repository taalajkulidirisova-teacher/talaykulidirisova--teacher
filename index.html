<!DOCTYPE html>
<html lang="ky">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Талайкүл Идирисова — Мугалим</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg, #fff5f8, #eef9ff, #f3fff6);
    color: #444;
    line-height: 1.6;
}

header {
    background: linear-gradient(135deg, #e87991, #d96d87, #b982c9);
    color: white;
    text-align: center;
    padding: 35px 20px 45px;
    border-radius: 0 0 35px 35px;
    box-shadow: 0 5px 20px rgba(0,0,0,0.12);
}

.logo {
    font-size: 25px;
    font-weight: bold;
    margin-bottom: 25px;
}

.hero {
    max-width: 900px;
    margin: auto;
}

.photo {
    width: 180px;
    height: 180px;
    border-radius: 50%;
    object-fit: cover;
    border: 7px solid white;
    box-shadow: 0 5px 20px rgba(0,0,0,0.2);
    margin-bottom: 15px;
}

.hero h1 {
    font-size: 32px;
    margin-bottom: 8px;
}

.hero p {
    font-size: 18px;
}

.school {
    margin-top: 12px;
    font-size: 16px;
    opacity: 0.95;
}

.container {
    max-width: 1100px;
    margin: 35px auto;
    padding: 0 18px;
}

section {
    margin-bottom: 35px;
}

.section-title {
    text-align: center;
    color: #c95778;
    font-size: 27px;
    margin-bottom: 22px;
}

.card {
    background: rgba(255,255,255,0.9);
    border-radius: 25px;
    padding: 25px;
    margin-bottom: 20px;
    box-shadow: 0 5px 20px rgba(0,0,0,0.08);
    border: 1px solid #f3dce4;
}

.about {
    text-align: center;
}

.about p {
    font-size: 17px;
    margin-bottom: 10px;
}

.info {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    gap: 15px;
    margin-top: 20px;
}

.info div {
    background: #fff4f7;
    padding: 15px;
    border-radius: 18px;
    text-align: center;
}

.principles {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    gap: 18px;
}

.principle {
    text-align: center;
    padding: 25px 18px;
    border-radius: 22px;
    background: white;
    box-shadow: 0 5px 15px rgba(0,0,0,0.07);
}

.principle .icon {
    font-size: 38px;
    margin-bottom: 10px;
}

.principle h3 {
    color: #c95778;
    margin-bottom: 8px;
}

.materials {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
    gap: 20px;
}

.subject {
    background: white;
    border-radius: 25px;
    padding: 25px;
    text-align: center;
    box-shadow: 0 5px 18px rgba(0,0,0,0.08);
    border-top: 6px solid #e87991;
}

.subject:nth-child(2) {
    border-top-color: #7bb7d8;
}

.subject:nth-child(3) {
    border-top-color: #91c99b;
}

.subject:nth-child(4) {
    border-top-color: #e6b96a;
}

.subject-icon {
    font-size: 45px;
}

.subject h3 {
    color: #555;
    margin: 10px 0;
}

.subject p {
    font-size: 14px;
    color: #777;
}

.btn {
    display: inline-block;
    margin-top: 15px;
    padding: 10px 20px;
    background: #e87991;
    color: white;
    text-decoration: none;
    border-radius: 25px;
    transition: 0.3s;
}

.btn:hover {
    background: #c95778;
    transform: translateY(-2px);
}

.certificates {
    text-align: center;
}

.certificates p {
    margin-bottom: 10px;
}

.contact {
    text-align: center;
}

.quote {
    text-align: center;
    background: linear-gradient(135deg, #fff0f5, #f1f8ff);
    border-radius: 25px;
    padding: 30px;
    font-size: 21px;
    font-style: italic;
    color: #9d536
