<!DOCTYPE html>
<html lang="ky">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Идирисова Талайкүл — Мугалим 🌷</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html{
    scroll-behavior:smooth;
}

body{
    font-family: "Segoe UI", Arial, sans-serif;
    color:#514452;
    background:
        radial-gradient(circle at 10% 10%, rgba(255,255,255,.8) 0 45px, transparent 46px),
        radial-gradient(circle at 90% 20%, rgba(255,255,255,.65) 0 35px, transparent 36px),
        linear-gradient(135deg,#fff3f7,#f0f8ff,#effbf5,#fff8ed);
    background-attachment:fixed;
    overflow-x:hidden;
}

/* Гүлдөр */
body:before,
body:after{
    position:fixed;
    z-index:-1;
    font-size:90px;
    opacity:.12;
}

body:before{
    content:"🌸";
    left:-15px;
    top:18%;
    transform:rotate(-15deg);
}

body:after{
    content:"🌷";
    right:-10px;
    bottom:12%;
    transform:rotate(15deg);
}

/* HEADER */
header{
    min-height:92vh;
    padding:25px 7% 60px;
    background:
        linear-gradient(135deg,
        rgba(232,121,145,.94),
        rgba(190,157,214,.88),
        rgba(126,190,190,.84));
    border-bottom-left-radius:70px;
    border-bottom-right-radius:70px;
    position:relative;
    overflow:hidden;
    box-shadow:0 15px 45px rgba(130,100,130,.18);
}

header:before{
    content:"🌸";
    position:absolute;
    font-size:180px;
    right:-25px;
    top:-55px;
    opacity:.15;
}

header:after{
    content:"🌿";
    position:absolute;
    font-size:150px;
    left:-25px;
    bottom:-50px;
    opacity:.14;
}

nav{
    max-width:1150px;
    margin:auto;
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:20px;
    position:relative;
    z-index:2;
}

.logo{
    color:white;
    font-size:25px;
    font-weight:800;
    text-shadow:0 2px 8px rgba(80,50,70,.2);
}

nav ul{
    list-style:none;
    display:flex;
    flex-wrap:wrap;
    justify-content:center;
    gap:8px;
}

nav a{
    color:white;
    text-decoration:none;
    font-size:14px;
    font-weight:600;
    padding:9px 13px;
    border-radius:25px;
    transition:.3s;
}

nav a:hover{
    background:rgba(255,255,255,.25);
    transform:translateY(-2px);
}

.hero{
    max-width:1150px;
    margin:65px auto 0;
    display:grid;
    grid-template-columns:1.15fr .85fr;
    align-items:center;
    gap:50px;
    position:relative;
    z-index:2;
}

.hero-text{
    color:white;
}

.small-title{
    display:inline-block;
    background:rgba(255,255,255,.2);
    border:1px solid rgba(255,255,255,.4);
    padding:8px 18px;
    border-radius:30px;
    margin-bottom:18px;
    font-size:14px;
}

.hero h1{
    font-size:52px;
    line-height:1.12;
    margin-bottom:18px;
    text-shadow:0 4px 15px rgba(70,40,60,.15);
}

.hero h1 span{
    color:#fff7d9;
}
