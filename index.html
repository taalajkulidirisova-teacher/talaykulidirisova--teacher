<!DOCTYPE html>
<html lang="ky">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Идирисова Талайкүл — Мугалим</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html{
    scroll-behavior:smooth;
}

body{
    font-family: Georgia, "Times New Roman", serif;
    background:
        radial-gradient(circle at 5% 15%, #fff1f4 0, transparent 18%),
        radial-gradient(circle at 95% 30%, #eaf7ff 0, transparent 20%),
        linear-gradient(180deg,#fffdfb,#fff8f5);
    color:#17385e;
}

/* HEADER */

header{
    height:78px;
    background:white;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 5%;
    box-shadow:0 2px 15px rgba(40,70,100,.08);
    position:sticky;
    top:0;
    z-index:1000;
}

.logo{
    display:flex;
    align-items:center;
    gap:10px;
    color:#17385e;
    font-size:24px;
    font-style:italic;
    font-weight:bold;
}

.logo-icon{
    font-size:40px;
}

.logo span{
    color:#ef6687;
}

nav{
    display:flex;
    align-items:center;
    gap:30px;
}

nav a{
    text-decoration:none;
    color:#17385e;
    font-size:14px;
    font-weight:bold;
}

nav a:hover{
    color:#ec6687;
}

.contact-btn{
    background:linear-gradient(135deg,#ed6487,#ef7c98);
    color:white!important;
    padding:14px 25px;
    border-radius:30px;
    box-shadow:0 5px 15px rgba(236,100,135,.25);
}

/* HERO */

.hero{
    min-height:530px;
    padding:35px 7% 25px;
    display:grid;
    grid-template-columns:1fr 1fr;
    align-items:center;
    position:relative;
    overflow:hidden;
}

.hero:before{
    content:"";
    position:absolute;
    width:450px;
    height:450px;
    border-radius:50%;
    background:#fff0f1;
    right:8%;
    top:30px;
    z-index:-1;
}

.hero:after{
    content:"";
    position:absolute;
    width:350px;
    height:350px;
    border-radius:50%;
    background:#edf8ff;
    left:-150px;
    top:130px;
    z-index:-1;
}

.hero-left{
    padding:20px;
}

.small-title{
    color:#ec7890;
    font-size:22px;
    font-style:italic;
    margin-bottom:14px;
}

.hero h1{
    color:#12365c;
    font-size:52px;
    line-height:1.05;
    letter-spacing:1px;
    margin-bottom:18px;
}

.hero h1 span{
    display:block;
}

.teacher-role{
    display:flex;
    align-items:center;
    gap:14px;
    font-size:17px;
    font-weight:bold;
    margin:20px 0;
}

.line{
    width:45px;
    height:2px;
    background:#d9aa58;
}

.quote{
    max-width:510px;
    font-size:16px;
    line-height:1.6;
    color:#405673;
    padding-left:42px;
    position:relative;
}

.quote:before{
    content:"“";
    position:absolute;
    left:0;
    top:-20px;
    font-size:70px;
    color:#f2a0b2;
}

.hero-buttons{
    display:flex;
    gap:15px;
    margin-top:25px;
}

.btn{
    padding:15px 28px;
    border-radius:30px;
    text-decoration:none;
    font-weight:bold;
    display:inline-block;
}

.btn-blue{
    background:#123b66;
    color:white;
}

.btn-pink{
    background:#ed6688;
    color:white;
}

.hero-right{
    display:flex;
    justify-content:center;
    align-items:center;
    position:relative;
}

.photo-frame{
    width:400px;
    height:440px;
    border-radius:50% 50% 46% 46%;
    background:linear-gradient(145deg,#f9c2ce,#ffe4e5);
    border:3px solid #dfb866;
    padding:8px;
    position:relative;
    box-shadow:0 15px 35px rgba(90,80,80,.12);
}

.photo-frame:before{
    content:"";
    position:absolute;
    inset:-12px;
    border:1px solid #d9bd78;
    border-radius:50%;
}

.teacher-photo{
    width:100%;
    height:100%;
    object-fit:cover;
    object-position:center top;
    border-radius:50% 50% 44% 44%;
}

/* FLOWERS */

.flower{
    position:absolute;
    font-size:65px;
    opacity:.8;
}

.flower.one{
    left:0;
    bottom:30px;
}

.flower.two{
    right:1%;
    bottom:20px;
}

/* VALUES */

.values{
    width:88%;
    margin:-15px auto 35px;
    background:white;
    border-radius:30px;
    padding:25px 20px;
    box-shadow:0 8px 30px rgba(40,60,80,.09);
    display:grid;
    grid-template-columns:repeat(5,1fr);
}

.value{
    text-align:center;
    padding:8px 18px;
    border-right:1px solid #eee;
}

.value:last-child{
    border:none;
}

.value-icon{
    font-size:42px;
    margin-bottom:8px;
}

.value p{
    color:#405673;
    font-size:14px;
    line-height:1.4;
    font-weight:bold;
}

/* SECTION */

section{
    padding:35px 6%;
}

.section-title{
    text-align:center;
    color:#17385e;
    font-size:30px;
    margin-bottom:25px;
    position:relative;
}

.section-title:before,
.section-title:after{
    content:"";
    display:inline-block;
    width:55px;
    height:2px;
    background:#efa2b2;
    vertical-align:middle;
    margin:0 15px;
}

.section-title small{
    display:block;
    color:#ef7290;
    font-size:22px;
    margin-top:5px;
}

/* MATERIALS */

.materials{
    display:grid;
    grid-template-columns:repeat(5,1fr);
    gap:14px;
}

.card{
    border-radius:20px;
    padding:22px 14px;
    text-align:center;
    min-height:215px;
    transition:.3s;
    box-shadow:0 4px 15px rgba(40,60,80,.06);
}

.card:hover{
    transform:translateY(-7px);
    box-shadow:0 12px 25px rgba(40,60,80,.13);
}

.card:nth-child(1){background:#e8f3ff;}
.card:nth-child(2){background:#edf9ed;}
.card:nth-child(3){background:#f5eaff;}
.card:nth-child(4){background:#fff4d9;}
.card:nth-child(5){background:#ffeaf0;}

.card-icon{
    font-size:45px;
    margin-bottom:8px;
}

.card h3{
    color:#17385e;
    margin-bottom:10px;
}

.card p{
    color:#53677e;
    font-size:13px;
    line-height:1.5;
    min-height:62px;
}

.card a{
    display:inline-block;
    margin-top:12px;
    padding:9px 22px;
    border-radius:25px;
    background:#2475ba;
    color:white;
    text-decoration:none;
    font-size:13px;
    font-weight:bold;
}

.card:nth-child(2) a{background:#45a76a;}
.card:nth-child(3) a{background:#b45bd0;}
.card:nth-child(4) a{background:#e9ae32;}
.card:nth-child(5) a{background:#ed6284;}

/* ACHIEVEMENTS */

.achievements{
    background:#073867;
    color:white;
    margin-top:25px;
    padding:35px 6%;
    position:relative;
    overflow:hidden;
}

.achievement-content{
    display:grid;
    grid-template-columns:280px 1fr;
    gap:30px;
    align-items:center;
}

.trophy{
    text-align:center;
}

.trophy-icon{
    font-size:75px;
}

.trophy h2{
    font-size:27px;
    margin:8px 0;
}

.trophy p{
    color:#e8eef6;
    line-height:1.5;
}

.gold-btn{
    display:inline-block;
    margin-top:15px;
    border:1px solid #d8b45b;
    border-radius:25px;
    padding:10px 25px;
    color:white;
    text-decoration:none;
}

.certificates{
    display:flex;
    gap:15px;
    overflow-x:auto;
    padding-bottom:10px;
}

.certificate{
    min-width:170px;
    text-align:center;
}

.certificate img{
    width:170px;
    height:110px;
    object-fit:cover;
    background:white;
    border-radius:7px;
    border:4px solid #fff;
    box-shadow:0 4px 10px rgba(0,0,0,.2);
}

.certificate p{
    margin-top:8px;
    font-size:13px;
}

/* EVENTS */

.events{
    display:grid;
    grid-template-columns:repeat(5,1fr);
    gap:13px;
}

.event{
    height:150px;
    border-radius:14px;
    overflow:hidden;
    box-shadow:0 5px 15px rgba(0,0,0,.1);
}

.event img{
    width:100%;
    height:100%;
    object-fit:cover;
}

.all-btn{
    text-align:center;
    margin-top:20px;
}

.all-btn a{
    border:2px solid #ee829d
