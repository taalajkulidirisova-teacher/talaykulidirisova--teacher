<!DOCTYPE html>
<html lang="ky">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Идирисова Талайкүл — Мугалим</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

html{
  scroll-behavior:smooth;
}

body{
  font-family:Georgia,"Times New Roman",serif;
  background:#fffaf7;
  color:#344054;
  line-height:1.6;
}

/* ===== HEADER ===== */

header{
  background:linear-gradient(135deg,#e87991,#d96d87,#c96f9b);
  color:white;
  padding:15px 5%;
  position:sticky;
  top:0;
  z-index:1000;
  box-shadow:0 4px 20px rgba(0,0,0,.12);
}

.nav{
  max-width:1250px;
  margin:auto;
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:20px;
}

.logo{
  font-size:22px;
  font-weight:bold;
  white-space:nowrap;
}

nav{
  display:flex;
  flex-wrap:wrap;
  justify-content:center;
}

nav a{
  color:white;
  text-decoration:none;
  margin:5px 10px;
  font-size:15px;
  transition:.3s;
}

nav a:hover{
  color:#fff3b0;
}

/* ===== HERO ===== */

.hero{
  min-height:620px;
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
  padding:70px 20px;
  background:
    radial-gradient(circle at 10% 15%,#ffdce5,transparent 30%),
    radial-gradient(circle at 90% 85%,#dff5e8,transparent 30%),
    radial-gradient(circle at 85% 10%,#fff1bd,transparent 25%),
    #fffaf7;
}

.hero-box{
  max-width:950px;
}

.photo-frame{
  width:210px;
  height:210px;
  margin:0 auto 25px;
  padding:7px;
  border-radius:50%;
  background:linear-gradient(135deg,#e87991,#f4c95d,#78c7a3,#8eb9e8);
  box-shadow:0 15px 40px rgba(0,0,0,.18);
}

.photo-frame img{
  width:100%;
  height:100%;
  object-fit:cover;
  border-radius:50%;
  border:5px solid white;
  display:block;
}

.hero h1{
  font-size:42px;
  color:#263b61;
  margin-bottom:8px;
}

.hero h2{
  color:#d85f7c;
  font-size:24px;
  margin-bottom:18px;
}

.hero p{
  font-size:18px;
  max-width:720px;
  margin:auto;
}

.button{
  display:inline-block;
  margin-top:28px;
  padding:13px 26px;
  border-radius:30px;
  background:linear-gradient(135deg,#e87991,#d35f7e);
  color:white;
  text-decoration:none;
  font-size:16px;
  box-shadow:0 7px 20px rgba(216,94,120,.25);
  transition:.3s;
}

.button:hover{
  transform:translateY(-3px);
}

/* ===== GENERAL ===== */

section{
  padding:75px 5%;
}

.container{
  max-width:1200px;
  margin:auto;
}

.section-title{
  text-align:center;
  font-size:32px;
  color:#263b61;
  margin-bottom:40px;
}

.section-title span{
  color:#d96885;
}

/* ===== DOCUMENTS TOP ===== */

.documents{
  background:linear-gradient(135deg,#fff3bd,#e7f7ee,#fce4eb);
}

.document-grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:25px;
}

.document-card{
  background:rgba(255,255,255,.9);
  padding:30px;
  border-radius:25px;
  text-align:center;
  box-shadow:0 8px 25px rgba(0,0,0,.08);
  border:2px solid rgba(255,255,255,.8);
  transition:.3s;
}

.document-card:hover{
  transform:translateY(-5px);
}

.document-icon{
  font-size:50px;
  margin-bottom:10px;
}

.document-card h3{
  color:#263b61;
  margin-bottom:8px;
}

.document-card p{
  margin-bottom:18px;
}

.document-button{
  display:inline-block;
  padding:10px 20px;
  background:#7ab99b;
  color:white;
  text-decoration:none;
  border-radius:20px;
  transition:.3s;
}

.document-button:hover{
  background:#55977a;
}

/* ===== ABOUT ===== */

.about{
  background:white;
}

.about-grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:25px;
}

.info-card{
  background:#fffaf7;
  padding:30px;
  border-radius:22px;
  text-align:center;
  box-shadow:0 7px 25px rgba(0,0,0,.06);
  border-top:5px solid #e87991;
}

.info-card .icon{
  font-size:42px;
  margin-bottom:8px;
}

.info-card h3{
  color:#d96885;
  margin-bottom:8px;
}

/* ===== PRINCIPLES ===== */

.principles{
  background:#fdf0f3;
}

.principle-grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:25px;
}

.principle{
  background:white;
  padding:30px;
  border-radius:22px;
  text-align:center;
  box-shadow:0 7px 25px rgba(0,0,0,.06);
}

.principle h3{
  color:#263b61;
  margin-bottom:10px;
}

/* ===== MATERIALS ===== */

.materials{
  background:white;
}

.subject-grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:25px;
}

.subject{
  background:#fffaf7;
  border-radius:25px;
  padding:30px;
  box-shadow:0 7px 25px rgba(0,0,0,.07);
  border-top:6px solid #e87991;
  transition:.3s;
}

.subject:hover{
  transform:translateY(-4px);
}

.subject-icon{
  font-size:45px;
}

.subject h3{
  font-size:25px;
  color:#263b61;
  margin:8px 0;
}

.subject p{
  margin-bottom:18px;
}

.classes{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:8px;
}

.class-btn{
  display:block;
  text-align:center;
  padding:10px 5px;
  background:#e87991;
  color:white;
  text-decoration:none;
  border-radius:12px;
  font-size:14px;
  transition:.3s;
}

.class-btn:hover{
  background:#263b61;
}

/* ===== EXTRA MATERIALS ===== */

.extra-materials{
  margin-top:30px;
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:20px;
}

.extra-card{
  padding:25px;
  border-radius:20px;
  text-align:center;
  background:linear-gradient(135deg,#fff3bd,#fce4eb);
  box-shadow:0 6px 20px rgba(0,0,0,.06);
}

.extra-card .icon{
  font-size:40px;
}

.extra-card h3{
  color:#263b61;
  margin:8px 0;
}

.extra-card a{
  display:inline-block;
  margin-top:10px;
  padding:8px 18px;
  border-radius:18px;
  background:#d96885;
  color:white;
  text-decoration:none;
}

/* ===== CERTIFICATES ===== */

.certificates{
  background:
    radial-gradient(circle at top left,#fff1bd,transparent 30%),
    #fdf0f3;
}

.certificate-note{
  max-width:700px;
  margin:0 auto 30px;
  text-align:center;
}

.certificate-grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:25px;
}

.certificate-card{
  background:white;
  padding:12px;
  border-radius:20px;
  box-shadow:0 8px 25px rgba(0,0,0,.09);
  transition:.3s;
  overflow:hidden;
}

.certificate-card:hover{
  transform:translateY(-5px);
}

.certificate-card img{
  width:100%;
  height:260px;
  object-fit:contain;
  background:#fafafa;
  border-radius:13px;
  cursor:pointer;
}

.certificate-card p{
  text-align:center;
  padding:12px 5px 5px;
  color:#263b61;
  font-weight:bold;
}

.no-certificates{
  background:white;
  padding:30px;
  border-radius:20px;
  text-align:center;
}

/* ===== GALLERY ===== */

.gallery{
  background:white;
}

.gallery-grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:20px;
}

.gallery-card{
  border-radius:20px;
  overflow:hidden;
  background:#fffaf7;
  box-shadow:0 6px 20px rgba(0,0,0,.07);
}

.gallery-card img{
  width:100%;
  height:230
