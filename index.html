<!DOCTYPE html>
<html lang="ky">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Талайкүл мугалим | Башталгыч класстын мугалими</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html{
    scroll-behavior:smooth;
}

body{
    font-family:Arial, Helvetica, sans-serif;
    background:#fffafc;
    color:#25344d;
    line-height:1.6;
}

a{
    text-decoration:none;
    color:inherit;
}

.container{
    width:92%;
    max-width:1180px;
    margin:auto;
}

/* ================= HEADER ================= */

header{
    background:rgba(255,255,255,.96);
    position:sticky;
    top:0;
    z-index:1000;
    box-shadow:0 3px 18px rgba(70,60,90,.08);
}

.navbar{
    min-height:78px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:20px;
}

.logo{
    display:flex;
    align-items:center;
    gap:10px;
    color:#c96582;
    font-family:Georgia,serif;
    font-size:23px;
    font-weight:bold;
    white-space:nowrap;
}

.logo span{
    font-size:28px;
}

nav{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:25px;
    flex-wrap:wrap;
}

nav a{
    font-size:14px;
    color:#4c5870;
    transition:.3s;
}

nav a:hover{
    color:#c96582;
}

/* ================= HERO ================= */

.hero{
    position:relative;
    overflow:hidden;
    background:
        radial-gradient(circle at 7% 20%,rgba(247,186,202,.35),transparent 20%),
        radial-gradient(circle at 90% 15%,rgba(184,218,235,.38),transparent 22%),
        linear-gradient(110deg,#fffaf7 0%,#fff7f5 48%,#f6fbff 100%);
    padding:75px 0 70px;
}

.hero:before{
    content:"✿";
    position:absolute;
    left:25px;
    top:30px;
    font-size:90px;
    color:rgba(218,130,157,.16);
}

.hero:after{
    content:"❀";
    position:absolute;
    right:35px;
    bottom:15px;
    font-size:100px;
    color:rgba(137,185,210,.16);
}

.hero-grid{
    display:grid;
    grid-template-columns:1.15fr .85fr;
    align-items:center;
    gap:50px;
}

.hero-small{
    color:#ca6883;
    font-family:Georgia,serif;
    font-size:20px;
    margin-bottom:13px;
}

.hero h1{
    font-family:Georgia,serif;
    font-size:43px;
    line-height:1.15;
    color:#173c63;
    margin-bottom:12px;
}

.hero h2{
    color:#6e7280;
    font-size:21px;
    font-weight:normal;
    margin-bottom:22px;
}

.hero p{
    max-width:640px;
    font-size:17px;
    color:#596273;
}

.buttons{
    display:flex;
    gap:13px;
    flex-wrap:wrap;
    margin-top:28px;
}

.btn{
    display:inline-block;
    padding:13px 23px;
    border-radius:30px;
    font-weight:bold;
    font-size:14px;
    transition:.3s;
}

.btn-pink{
    background:#d97f98;
    color:white;
    box-shadow:0 8px 18px rgba(201,101,130,.22);
}

.btn-pink:hover{
    transform:translateY(-2px);
}

.btn-light{
    background:white;
    color:#55718d;
    border:1px solid #d9e1ea;
}
