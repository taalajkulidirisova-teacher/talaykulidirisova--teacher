<!DOCTYPE html>
<html lang="ky">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Сабактын иштелмелери</title>

<style>
body{
  margin:0;
  font-family:Georgia, "Times New Roman", serif;
  background:#fdf7f8;
  color:#152e52;
}

header{
  text-align:center;
  padding:45px 20px 30px;
  background:#f9dce3;
}

h1{
  margin:0;
  font-size:32px;
}

.subtitle{
  margin-top:12px;
  font-size:17px;
}

.container{
  max-width:900px;
  margin:35px auto;
  padding:0 20px;
}

.grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
  gap:20px;
}

.card{
  background:white;
  border-radius:18px;
  padding:28px 20px;
  text-align:center;
  box-shadow:0 4px 15px rgba(0,0,0,.08);
}

.icon{
  font-size:42px;
  margin-bottom:10px;
}

h2{
  font-size:21px;
  margin:10px 0 18px;
}

a{
  display:inline-block;
  text-decoration:none;
  background:#e87991;
  color:white;
  padding:10px 18px;
  border-radius:20px;
}

.back{
  background:#152e52;
  margin-bottom:25px;
}
</style>
</head>

<body>

<header>
  <h1>📚 Сабактын иштелмелери</h1>
  <p class="subtitle">
    Башталгыч класстар үчүн сабактын иштелмелери
  </p>
</header>

<div class="container">

  <a class="back" href="../classes.html">← Математикага кайтуу</a>

  <div class="grid">

    <div class="card">
      <div class="icon">1️⃣</div>
      <h2>1-класс</h2>
      <a href="./1-класс/">Көрүү →</a>
    </div>

    <div class="card">
      <div class="icon">2️⃣</div>
      <h2>2-класс</h2>
      <a href="./2-класс/">Көрүү →</a>
    </div>

    <div class="card">
      <div class="icon">3️⃣</div>
      <h2>3-класс</h2>
      <a href="./3-класс/">Көрүү →</a>
    </div>

    <div class="card">
      <div class="icon">4️⃣</div>
      <h2>4-класс</h2>
      <a href="./4-класс/">Көрүү →</a>
    </div>

  </div>

</div>

</body>
</html>
