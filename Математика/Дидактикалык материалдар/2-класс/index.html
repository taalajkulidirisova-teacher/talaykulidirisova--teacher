<!DOCTYPE html>

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Математика — 2-класс</title>

<style>
body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#fffdfb;
  color:#172d4d;
  padding:25px 15px;
}

h1{
  text-align:center;
  margin-bottom:30px;
}

#materials{
  max-width:900px;
  margin:auto;
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
  gap:18px;
}

.card{
  background:white;
  padding:12px;
  border-radius:15px;
  box-shadow:0 3px 15px rgba(0,0,0,.08);
  text-align:center;
}

.card img{
  width:100%;
  height:180px;
  object-fit:contain;
  border-radius:10px;
}

.card a{
  display:block;
  margin-top:10px;
  text-decoration:none;
  color:#172d4d;
  font-weight:bold;
}

.back{
  display:block;
  text-align:center;
  margin:30px 0;
  color:#e87991;
  font-weight:bold;
  text-decoration:none;
}
</style>
</head>
